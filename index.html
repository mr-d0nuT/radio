<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ràdio">
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="manifest" href="manifest.json">
    <title>Emissores de ràdio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
        .vinyl-spin {
            animation: spin-slow 4s linear infinite;
            border-radius: 50% !important;
            border: 2px solid #111;
            box-shadow: 0 0 10px rgba(255, 214, 0, 0.5);
        }

        .glass-panel {
            background: rgba(20, 20, 25, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .animate-blink { animation: blink 2s ease-in-out infinite; }

        @keyframes bounce-bar {
            0%, 100% { transform: scaleY(0.2); }
            50% { transform: scaleY(1); }
        }
        .eq-bar {
            width: 3px;
            background-color: #ffd600;
            border-radius: 2px;
            transform-origin: bottom;
            animation: bounce-bar 1s ease-in-out infinite;
        }
        .eq-bar:nth-child(2) { animation-delay: 0.2s; }
        .eq-bar:nth-child(3) { animation-delay: 0.4s; }
        .eq-bar:nth-child(4) { animation-delay: 0.1s; }
        .eq-bar:nth-child(5) { animation-delay: 0.5s; }

        .hidden-app { display: none !important; }

        body {
            margin: 0;
            background: linear-gradient(135deg, #1c103f, #0f0f1a, #2b1122);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        .station-card { transition: all 0.2s ease; }
        .station-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255, 214, 0, 0.15); border-color: rgba(255, 214, 0, 0.3); }

        /* Slider genèric (barra de volum del gadget) */
        .vol-range {
            -webkit-appearance: none; appearance: none;
            height: 3px; border-radius: 999px;
            background: rgba(255,255,255,0.2);
            cursor: pointer; outline: none;
        }
        .vol-range::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 11px; height: 11px; border-radius: 50%;
            background: #fff; border: none;
        }

        /* ============================================================
           FINESTRA FLOTANT (Document PiP / popup)
           El <body> d'aquella finestra rep .pip-body + una classe de
           densitat (.t-micro / .t-compact / .t-full) segons la mida que
           l'usuari li doni arrossegant-ne la cantonada.
           ============================================================ */
        body.pip-body {
            height: 100%;
            display: block;
            overflow: hidden;
            background: #0a0a0f;
        }
        body.pip-body #gadget-view {
            width: 100% !important;
            height: 100%;
            box-sizing: border-box;
            border: none !important;
            border-radius: 0 !important;
            background: radial-gradient(120% 100% at 50% 0%, #1e1338 0%, #0a0a0f 70%);
            justify-content: center;
            padding: 16px 18px;
            gap: 12px;
        }
        /* El botó "restaurar" només té sentit dins la pàgina */
        body.pip-body .only-in-page { display: none !important; }
        .only-in-float { display: none; }
        body.pip-body .only-in-float { display: flex; }

        /* --- Densitat COMPACTA: sense volum ni preferides --- */
        body.pip-body.t-compact #gadget-volume,
        body.pip-body.t-compact #gadget-favs { display: none !important; }
        body.pip-body.t-compact #gadget-artwork-container { width: 48px; height: 48px; }
        body.pip-body.t-compact #btn-gadget-play { width: 48px; height: 48px; }
        body.pip-body.t-compact #gadget-view { gap: 10px; }

        /* --- Densitat MICRO: una sola fila (caràtula + títol + play) --- */
        body.pip-body.t-micro #gadget-view {
            flex-direction: row; align-items: center;
            gap: 12px; padding: 10px 14px;
        }
        body.pip-body.t-micro #gadget-header,
        body.pip-body.t-micro #gadget-volume,
        body.pip-body.t-micro #gadget-favs,
        body.pip-body.t-micro #btn-gadget-prev,
        body.pip-body.t-micro #btn-gadget-next { display: none !important; }
        body.pip-body.t-micro #gadget-main { flex: 1; min-width: 0; margin: 0; gap: 10px; }
        body.pip-body.t-micro #gadget-artwork-container { width: 38px; height: 38px; }
        body.pip-body.t-micro #gadget-title { font-size: 13px; }
        body.pip-body.t-micro #gadget-controls {
            margin: 0; padding: 0; border: none; width: auto; flex: none;
        }
        body.pip-body.t-micro #btn-gadget-play { width: 38px; height: 38px; }
        body.pip-body.t-micro #btn-gadget-play svg { width: 16px; height: 16px; }

        /* --- Amplada molt curta: amaguem el subtítol --- */
        body.pip-body.w-narrow #gadget-subtitle { display: none; }

        /* Xips de preferides del gadget */
        .fav-chip {
            width: 22px; height: 22px; border-radius: 7px;
            font-size: 10px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.45);
            border: 1px solid rgba(255,255,255,0.08);
            transition: all .15s ease;
        }
        .fav-chip:hover { background: rgba(255,255,255,0.14); color: #fff; }
        .fav-chip.is-active {
            background: #ffd600; color: #000; border-color: #ffd600;
            box-shadow: 0 0 10px rgba(255,214,0,.35);
        }

        /* Toast */
        #toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(15,15,20,.95); border: 1px solid rgba(255,255,255,.12);
            color: #fff; font-size: 12px; padding: 10px 16px; border-radius: 10px;
            opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 99999;
            max-width: 80vw; text-align: center;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ============================================================
           AMBIENT
           El logotip de l'emissora, ampliat i desenfocat fins que només en
           queda el color, respirant darrere de tot. Canvia amb l'emissora.
           ============================================================ */
        #ambient {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; overflow: hidden;
        }
        .ambient-layer {
            position: absolute; inset: -25%;
            background-size: cover; background-position: center;
            filter: blur(72px) saturate(220%);
            opacity: 0;
            transition: opacity 1.4s ease;
            transform: scale(1.6);
        }
        .ambient-layer.on { opacity: .55; animation: ambient-drift 44s ease-in-out infinite alternate; }

        @keyframes ambient-drift {
            from { transform: scale(1.5) translate3d(-3%, -2%, 0); }
            to   { transform: scale(1.8) translate3d(3%, 2%, 0); }
        }

        /* Dins de la finestra de l'app. Imprescindible al mòbil, on l'app
           ocupa tota la pantalla i taparia el fons de darrere. */
        #view-ambient { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
        #view-ambient .ambient-layer { filter: blur(70px) saturate(200%); }
        #view-ambient .ambient-layer.on { opacity: .32; }
        #main-view > *:not(#view-ambient) { position: relative; z-index: 1; }

        /* Dins del gadget, el mateix però contingut a la seva capsa */
        #gadget-view { overflow: hidden; }
        #gadget-ambient { position: absolute; inset: 0; z-index: 0; overflow: hidden; border-radius: inherit; }
        #gadget-ambient .ambient-layer { filter: blur(34px) saturate(220%); inset: -35%; }
        #gadget-ambient .ambient-layer.on { opacity: .45; }
        #gadget-view > *:not(#gadget-ambient) { position: relative; z-index: 1; }

        @media (prefers-reduced-motion: reduce) {
            .ambient-layer.on { animation: none; }
        }

        /* ============================================================
           VISUALITZADOR
           Espectre real del so que sona, llegit amb la Web Audio API.
           ============================================================ */
        .viz {
            position: absolute; left: 0; right: 0; bottom: 0;
            width: 100%; pointer-events: none;
        }
        /* Res de transicions d'opacitat: quan no hi ha dades, simplement
           no dibuixem. Així el canvas no es pot quedar a mig esvair-se. */
        .viz:not(.on) { visibility: hidden; }
        #viz-main {
            bottom: 100%; height: 74px; z-index: 2;
            /* Una mica d'aire als costats. Amb width:auto un <canvas> no
               s'estira (és un element reemplaçat), cal dir-li l'amplada. */
            left: 18px; right: auto; width: calc(100% - 36px);
            /* una base fosca perquè els blocs de color ressaltin com a la referència */
            background: linear-gradient(to top, rgba(0,0,0,.8) 0%, rgba(0,0,0,.55) 55%, rgba(0,0,0,0) 100%);
        }
        #viz-gadget { height: 44px; z-index: 0; }

        /* L'ambient batega amb els greus */
        .ambient-layer.on {
            transform-origin: center;
            transition: opacity 1.4s ease;
        }
        #view-ambient .ambient-layer.on,
        #ambient .ambient-layer.on {
            opacity: calc(var(--pulse-base, .32) + var(--bass, 0) * .22);
        }
        #ambient .ambient-layer.on { --pulse-base: .55; }
        #view-ambient .ambient-layer.on { --pulse-base: .32; }
        #gadget-ambient .ambient-layer.on { --pulse-base: .45; }

        /* ============================================================
           MÒBIL / TAULETA — la finestra "d'escriptori" passa a pantalla completa
           ============================================================ */
        @media (max-width: 768px) {
            body { align-items: stretch; justify-content: stretch; }
            #main-view {
                width: 100% !important; height: 100% !important;
                max-width: none; max-height: none;
                border-radius: 0 !important; border: none;
                padding-top: env(safe-area-inset-top);
            }
            #content-area { flex-direction: column; }

            /* El gadget flotant no existeix a iOS: el botó només confondria */
            #btn-gadget-mode { display: none !important; }

            /* Capçalera del mòbil: [+] 🍩 Ràdio ......... banderes.
               Més alta perquè el dònut hi càpiga sencer, sense escapçar-lo. */
            #header-bar { min-height: 4.75rem; padding-top: 10px; padding-bottom: 10px; }
            #logo-donut { height: 3.25rem; width: auto; }
            #flags-row { width: auto; flex: 0 1 auto; }
            #flags-row > button { flex: 0 0 auto; }

            /* Les preferides passen de barra lateral a tira horitzontal */
            #fav-sidebar {
                width: 100%; flex-shrink: 0;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,.05);
                padding: 10px 12px;
            }
            #fav-sidebar.is-empty { display: none; }
            #lbl-favorites { margin-bottom: 8px; }
            #favorites-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
            #favorites-list > div { min-width: 145px; }
            #favorites-empty { display: none !important; }

            /* Barra del reproductor: sense volum (a iOS el volum és de maquinari) */
            #player-volume { display: none !important; }
            #player-info { width: auto; flex: 1; min-width: 0; }
            #player-controls { flex: none; }
            #player-bar {
                height: auto; padding: 10px 14px;
                padding-bottom: calc(10px + env(safe-area-inset-bottom));
                gap: 10px;
            }
            #player-controls .flex { gap: 18px; }

            /* Capçalera: les banderes es poden fer scroll en comptes d'esclafar-se */
            #flags-row { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            #flags-row::-webkit-scrollbar { display: none; }

            #detached-placeholder { width: 90%; }
        }

        /* Pantalles molt estretes: retallem marges perquè hi càpiga tot */
        @media (max-width: 420px) {
            #player-bar, #add-form { padding-left: 12px; padding-right: 12px; }
            #flags-row { gap: 4px; }
        }
    </style>
</head>
<body>

    <!-- El color de l'emissora, darrere de tot -->
    <div id="ambient">
        <div class="ambient-layer"></div>
        <div class="ambient-layer"></div>
    </div>

    <!-- MAIN WINDOW VIEW -->
    <div id="main-view" class="w-full h-full max-w-[900px] max-h-[650px] glass-panel rounded-xl shadow-2xl flex flex-col overflow-hidden relative z-10">

        <div id="view-ambient">
            <div class="ambient-layer"></div>
            <div class="ambient-layer"></div>
        </div>

        <!-- MAC HEADER & FLAGS -->
        <div id="header-bar" class="min-h-[3.5rem] py-2 bg-black/40 border-b border-white/5 flex items-center px-4 justify-between select-none shrink-0">
            <div id="header-left" class="flex items-center gap-2 min-w-0">
                <button id="btn-gadget-mode" onclick="enterGadgetMode()" class="text-white/30 hover:text-white transition-colors p-1 bg-white/5 hover:bg-white/10 rounded-md" title="Minimitzar a gadget flotant (sobre l'escriptori)">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <button id="btn-add-station" onclick="toggleAddForm()" class="text-white/30 hover:text-white transition-colors p-1 bg-white/5 hover:bg-white/10 rounded-md" title="Afegir una emissora que no és a la llista">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>

                <div class="flex items-center gap-2 min-w-0 ml-1" id="main-title">
                    <img src="donut.png" alt="" id="logo-donut" class="h-10 w-auto object-contain shrink-0 drop-shadow-[0_1px_3px_rgba(0,0,0,0.5)]">
                    <span class="text-sm font-semibold text-white/90 tracking-wide truncate" id="main-title-text">Ràdio</span>
                </div>
            </div>

            <div id="flags-row" class="flex items-center gap-1.5 w-1/4 justify-end shrink-0">
                <button onclick="changeLanguage('es', 'ES')" class="w-5 h-3.5 rounded-sm overflow-hidden opacity-50 hover:opacity-100 transition-opacity" title="España"><img src="https://flagcdn.com/w20/es.png" class="w-full h-full object-cover"></button>
                <button onclick="changeLanguage('ca', 'Catalunya')" class="w-5 h-3.5 rounded-sm overflow-hidden opacity-50 hover:opacity-100 transition-opacity" title="Catalunya">
                    <svg viewBox="0 0 900 600" class="w-full h-full object-cover"><rect width="900" height="600" fill="#fcd116"/><rect width="900" height="66.66" y="66.66" fill="#ce1126"/><rect width="900" height="66.66" y="200" fill="#ce1126"/><rect width="900" height="66.66" y="333.33" fill="#ce1126"/><rect width="900" height="66.66" y="466.66" fill="#ce1126"/></svg>
                </button>
                <button onclick="changeLanguage('fr', 'FR')" class="w-5 h-3.5 rounded-sm overflow-hidden opacity-50 hover:opacity-100 transition-opacity" title="France"><img src="https://flagcdn.com/w20/fr.png" class="w-full h-full object-cover"></button>
                <button onclick="changeLanguage('it', 'IT')" class="w-5 h-3.5 rounded-sm overflow-hidden opacity-50 hover:opacity-100 transition-opacity" title="Italia"><img src="https://flagcdn.com/w20/it.png" class="w-full h-full object-cover"></button>
                <button onclick="changeLanguage('de', 'DE')" class="w-5 h-3.5 rounded-sm overflow-hidden opacity-50 hover:opacity-100 transition-opacity" title="Deutschland"><img src="https://flagcdn.com/w20/de.png" class="w-full h-full object-cover"></button>
                <button onclick="changeLanguage('zh', 'CN')" class="w-5 h-3.5 rounded-sm overflow-hidden opacity-50 hover:opacity-100 transition-opacity" title="China"><img src="https://flagcdn.com/w20/cn.png" class="w-full h-full object-cover"></button>
                <button onclick="changeLanguage('ja', 'JP')" class="w-5 h-3.5 rounded-sm overflow-hidden opacity-50 hover:opacity-100 transition-opacity" title="Japan"><img src="https://flagcdn.com/w20/jp.png" class="w-full h-full object-cover"></button>
                <button onclick="changeLanguage('ar', 'MA')" class="w-5 h-3.5 rounded-sm overflow-hidden opacity-50 hover:opacity-100 transition-opacity" title="Morocco"><img src="https://flagcdn.com/w20/ma.png" class="w-full h-full object-cover"></button>
            </div>
        </div>

        <!-- SEARCH AND FILTER ROW -->
        <div class="px-6 py-4 flex gap-4 border-b border-white/5 bg-black/20 shrink-0">
            <div class="relative flex-1">
                <svg class="w-4 h-4 absolute left-3 top-3 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="search-input" placeholder="Cercar emissora (ex: Altafulla)..." class="w-full bg-white/5 border border-white/10 rounded-lg py-2.5 pl-10 pr-4 text-sm text-white placeholder-white/40 focus:outline-none focus:border-[#ffd600]/50 transition-colors">
            </div>
            <select id="country-select" class="bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-[#ffd600]/50 w-40 cursor-pointer appearance-none">
                <option value="Catalunya" class="bg-gray-900">Catalunya</option>
                <option value="ES" class="bg-gray-900">España</option>
                <option value="FR" class="bg-gray-900">Francia</option>
                <option value="IT" class="bg-gray-900">Italia</option>
                <option value="DE" class="bg-gray-900">Alemania</option>
                <option value="CN" class="bg-gray-900">China</option>
                <option value="JP" class="bg-gray-900">Japón</option>
                <option value="MA" class="bg-gray-900">Marruecos</option>
            </select>
        </div>

        <!-- AFEGIR EMISSORA A MÀ (per a les que no són a Radio Browser) -->
        <div id="add-form" class="hidden px-6 py-3 flex gap-2 border-b border-white/5 bg-[#ffd600]/5 shrink-0 items-center">
            <input type="text" id="add-name" placeholder="Nom" class="w-40 bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-white/40 focus:outline-none focus:border-[#ffd600]/50">
            <input type="text" id="add-url" placeholder="https://... (URL del stream)" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-white/40 focus:outline-none focus:border-[#ffd600]/50">
            <button onclick="addCustomStation()" class="px-4 py-2 bg-[#ffd600] text-black text-sm font-bold rounded-lg hover:bg-yellow-400 transition-colors shrink-0" id="lbl-add-btn">Afegir</button>
        </div>

        <!-- CONTENT AREA -->
        <div id="content-area" class="flex-1 flex overflow-hidden">
            <!-- Sidebar Favorites -->
            <div id="fav-sidebar" class="w-64 border-r border-white/5 bg-black/20 flex flex-col p-4 shrink-0">
                <div class="text-[10px] font-bold text-white/40 tracking-wider mb-4 flex justify-between items-center" id="lbl-favorites">
                    PREFERIDES (0/5)
                </div>
                <div id="favorites-list" class="flex flex-col gap-2 overflow-y-auto pr-1"></div>
                <div id="favorites-empty" class="text-xs text-white/30 text-center mt-4 border border-dashed border-white/10 rounded-lg p-6 bg-white/5">
                    Afegeix fins a 5 preferides per accés ràpid.
                </div>
            </div>

            <!-- Main Grid -->
            <div class="flex-1 overflow-y-auto p-4 relative" id="stations-grid">
                <div id="loading-spinner" class="absolute inset-0 flex items-center justify-center">
                    <svg class="animate-spin h-8 w-8 text-[#ffd600]" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </div>
                <div id="stations-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 hidden"></div>
            </div>
        </div>

        <!-- PLAYER BOTTOM BAR -->
        <div id="player-bar" class="h-20 bg-black/60 border-t border-white/5 flex items-center px-6 gap-4 shrink-0 backdrop-blur-xl">
            <canvas id="viz-main" class="viz"></canvas>
            <div id="player-info" class="flex items-center gap-3 w-1/3 min-w-0">
                <div class="w-12 h-12 bg-white/10 rounded-lg flex items-center justify-center overflow-hidden shrink-0" id="player-artwork-container">
                    <span class="text-white/40 text-xs font-bold" id="player-initial">R</span>
                    <img id="player-img" src="" class="w-full h-full object-cover hidden">
                </div>
                <div class="flex flex-col overflow-hidden">
                    <span class="text-sm font-bold text-white truncate" id="player-title">Selecciona una emissora</span>
                    <span class="text-xs truncate flex items-center gap-1">
                        <span id="player-subtitle" class="text-[#ffd600] truncate">Milers d'opcions</span>
                        <button id="btn-open-tab" onclick="openStreamInTab()" class="hidden text-[10px] font-bold text-black bg-[#ffd600] hover:bg-yellow-400 rounded px-1.5 py-0.5 ml-1 shrink-0 transition-colors">▶</button>
                        <span id="player-eq" class="hidden h-3 flex items-end gap-[1px] ml-1 shrink-0">
                            <span class="eq-bar h-1"></span><span class="eq-bar h-2"></span><span class="eq-bar h-3"></span><span class="eq-bar h-1.5"></span><span class="eq-bar h-2.5"></span>
                        </span>
                    </span>
                </div>

        let customStations = [];

        /**
         * Carrega les pròpies i hi afegeix les de la llista que no s'hagin
         * ofert mai. Guardem quines s'han ofert perquè, si en treus alguna,
         * no et torni a sortir a la pròxima actualització.
         */
        function loadCustomStations() {
            try { customStations = JSON.parse(localStorage.getItem('radioCustom') || '[]') || []; }
            catch (e) { customStations = []; }

            let seen = [];
            try { seen = JSON.parse(localStorage.getItem('radioSeedsSeen') || '[]') || []; }
            catch (e) { seen = []; }

            const present = new Set(customStations.map(s => s.url_resolved));
            let added = 0;
            SEED_STATIONS.forEach(s => {
                if (seen.includes(s.id) || present.has(s.url_resolved)) return;
                customStations.push({
                    stationuuid: 'seed-' + s.id, name: s.name, url_resolved: s.url_resolved,
                    country: 'Catalunya', favicon: '', custom: true
                });
                added++;
            });
            localStorage.setItem('radioSeedsSeen', JSON.stringify(SEED_STATIONS.map(s => s.id)));
            if (added) saveCustomStations();
        }

        function saveCustomStations() {
            localStorage.setItem('radioCustom', JSON.stringify(customStations));
        }

        function toggleAddForm() {
            const f = byId('add-form');
            f.classList.toggle('hidden');
            if (!f.classList.contains('hidden')) byId('add-name').focus();
        }

        function addCustomStation() {
            const name = byId('add-name').value.trim();
            const url = byId('add-url').value.trim();
            if (!name || !url) { toast(t().addMissing); return; }
            if (!/^https?:\/\//i.test(url)) { toast(t().addBadUrl); return; }

            customStations.push({
                stationuuid: 'custom-' + Date.now(),
                name, url_resolved: url, country: t().ownStation, favicon: '', custom: true, own: true
            });
            saveCustomStations();
            byId('add-name').value = '';
            byId('add-url').value = '';
            byId('add-form').classList.add('hidden');
            toast(t().addOk);
            fetchStations(byId('country-select').value);
        }

        function removeCustomStation(uuid) {
            customStations = customStations.filter(s => s.stationuuid !== uuid);
            saveCustomStations();
            allStations = allStations.filter(s => s.stationuuid !== uuid);
            renderStations(allStations);
        }

        /**
         * Barreja les pròpies amb les de l'API i ho torna tot ordenat de la A a
         * la Z, en una sola llista. Cercant, les pròpies es filtren pel nom i
         * surten sigui quina sigui la regió; sense cercar, les catalanes només
         * surten a Catalunya (si no, apareixerien també mirant el Japó).
         */
        function withCustom(list, { query = '', region = '' } = {}) {
            const q = query.trim().toLowerCase();
            const mine = q
                ? customStations.filter(s => s.name.toLowerCase().includes(q))
                : customStations.filter(s => s.own || region === 'Catalunya');
            return [...mine, ...list].sort((a, b) =>
                a.name.trim().localeCompare(b.name.trim(), undefined, { sensitivity: 'base' }));
        }

        // --- Estat ---
        let currentLang = 'ca';
        // L'element d'àudio es recrea segons faci falta CORS o no (vegeu useAudioMode).
        let audio = new Audio();
        let audioCors = false;
        let hls = null;
        let isPlaying = false;
        let currentStation = null;
        let allStations = [];
        let favorites = JSON.parse(localStorage.getItem('radioFavs') || '[]');

        // Finestra flotant (Document PiP o popup). Mentre existeix, el gadget hi viu dins.
        let floatWin = null;

        /** Busca un element pel seu id al document principal O a la finestra flotant. */
        function byId(id) {
            const el = document.getElementById(id);
            if (el) return el;
            if (floatWin && !floatWin.closed) return floatWin.document.getElementById(id);
            return null;
        }

        /** Missatge efímer, sempre a la finestra que l'usuari està mirant. */
        function toast(msg) {
            const host = (floatWin && !floatWin.closed) ? floatWin.document : document;
            let el = host.getElementById('toast');
            if (!el) {
                el = host.createElement ? host.createElement('div') : document.createElement('div');
                el.id = 'toast';
                host.body.appendChild(el);
            }
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._t);
            el._t = setTimeout(() => el.classList.remove('show'), 3200);
        }

        // ============================================================
        // ICONES
        // ============================================================
        const ICON = {
            play:  s => `<svg class="${s} ml-[2px]" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"></path></svg>`,
            pause: s => `<svg class="${s}" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>`,
            heartOn:  s => `<svg class="${s} text-[#ffd600] fill-current" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>`,
            heartOff: s => `<svg class="${s}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>`,
            volOn:  s => `<svg class="${s}" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>`,
            volOff: s => `<svg class="${s}" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM12.293 7.293a1 1 0 011.414 0L15 8.586l1.293-1.293a1 1 0 111.414 1.414L16.414 10l1.293 1.293a1 1 0 01-1.414 1.414L15 11.414l-1.293 1.293a1 1 0 01-1.414-1.414L13.586 10l-1.293-1.293a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>`
        };

        // ============================================================
        // FINESTRA FLOTANT SOBRE L'ESCRIPTORI
        // ============================================================

        /** Clona el CSS del document principal (inclòs el que genera Tailwind) cap a la finestra flotant. */
        function copyStylesTo(targetDoc) {
            [...document.styleSheets].forEach(sheet => {
                try {
                    const css = [...sheet.cssRules].map(r => r.cssText).join('\n');
                    const style = document.createElement('style');
                    style.textContent = css;
                    targetDoc.head.appendChild(style);
                } catch (e) {
                    if (sheet.href) {
                        const link = document.createElement('link');
                        link.rel = 'stylesheet';
                        link.href = sheet.href;
                        targetDoc.head.appendChild(link);
                    }
                }
            });
        }

        /**
         * Adapta el gadget a la mida real de la finestreta.
         * L'usuari pot arrossegar-ne la cantonada: passem de la vista completa
         * a la compacta i, si l'encongeix molt, a una sola fila.
         */
        function applyDensity() {
            if (!floatWin || floatWin.closed) return;
            const b = floatWin.document.body;
            const h = floatWin.innerHeight, w = floatWin.innerWidth;
            b.classList.remove('t-micro', 't-compact', 't-full');
            b.classList.add(h < 150 ? 't-micro' : h < 250 ? 't-compact' : 't-full');
            b.classList.toggle('w-narrow', w < 250);
        }

        /** Trasllada el gadget a la finestra flotant (conserva listeners i estat). */
        function moveGadgetInto(win) {
            floatWin = win;
            const doc = win.document;

            doc.title = currentStation ? currentStation.name : t().title;
            copyStylesTo(doc);
            doc.body.className = 'pip-body';

            const toastEl = document.createElement('div');
            toastEl.id = 'toast';
            doc.body.appendChild(toastEl);

            doc.body.appendChild(byId('gadget-view'));
            byId('gadget-view').classList.remove('hidden-app');

            doc.addEventListener('keydown', onKeyShortcut);
            win.addEventListener('resize', applyDensity);
            // El ResizeObserver és el senyal fiable: el 'resize' de la finestra
            // no sempre arriba mentre s'arrossega la cantonada.
            if (win.ResizeObserver) new win.ResizeObserver(applyDensity).observe(doc.documentElement);
            win.addEventListener('pagehide', restoreGadget, { once: true });
            win.addEventListener('unload', restoreGadget, { once: true });

            applyDensity();
            renderGadgetFavs();
            syncVolumeUI();
            updateFavIcons();

            // Donem el focus a la finestreta: el navegador queda al darrere.
            // (Cap API web pot minimitzar la finestra origen; això és el màxim permès.)
            win.focus();

            byId('placeholder-station').textContent = currentStation ? currentStation.name : '';
            document.getElementById('main-view').classList.add('hidden-app');
            document.getElementById('detached-placeholder').classList.remove('hidden-app');
        }

        /** Retorna el gadget a la pestanya i mostra la finestra gran. */
        function restoreGadget() {
            if (floatWin && !floatWin.closed) {
                const g = floatWin.document.getElementById('gadget-view');
                if (g) document.body.appendChild(g);
            }
            floatWin = null;

            const g = document.getElementById('gadget-view');
            if (g) {
                g.classList.add('hidden-app');
                g.classList.remove('t-micro', 't-compact', 't-full');
            }
            document.getElementById('detached-placeholder').classList.add('hidden-app');
            document.getElementById('main-view').classList.remove('hidden-app');
            syncVolumeUI();
        }

        /**
         * Minimitza a gadget:
         *  1) Document PiP -> finestra real SEMPRE per damunt de tot (Chrome/Edge 116+)
         *  2) window.open  -> finestra separada (Safari/Firefox), sense always-on-top
         *  3) Dins la pàgina, com a últim recurs
         */
        async function enterGadgetMode() {
            if (floatWin && !floatWin.closed) { floatWin.focus(); return; }

            if ('documentPictureInPicture' in window) {
                try {
                    const pip = await documentPictureInPicture.requestWindow({ width: 360, height: 300 });
                    moveGadgetInto(pip);
                    if (!localStorage.getItem('radioPipHint')) {
                        localStorage.setItem('radioPipHint', '1');
                        setTimeout(() => toast(t().pipHint), 900);
                    }
                    return;
                } catch (e) {
                    console.warn('Document PiP no disponible:', e);
                }
            }

            const popup = window.open('', 'radioGadget', 'width=360,height=320,popup=yes,menubar=no,toolbar=no,location=no,status=no');
            if (popup) {
                popup.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>');
                popup.document.close();
                moveGadgetInto(popup);
                return;
            }

            // Fallback dins la pàgina
            toast(t().popupBlocked);
            document.getElementById('main-view').classList.add('hidden-app');
            document.getElementById('gadget-view').classList.remove('hidden-app');
        }

        function exitGadgetMode() {
            if (floatWin && !floatWin.closed) {
                const w = floatWin;
                restoreGadget();
                w.close();
                return;
            }
            restoreGadget();
        }

        /** Dreceres de teclat, actives tant a la pestanya com a la finestra flotant. */
        function onKeyShortcut(e) {
            const tag = (e.target.tagName || '').toLowerCase();
            if (tag === 'input' || tag === 'select' || tag === 'textarea') return;

            switch (e.key) {
                case ' ':          e.preventDefault(); togglePlay(); break;
                case 'ArrowRight': e.preventDefault(); playNext(); break;
                case 'ArrowLeft':  e.preventDefault(); playPrev(); break;
                case 'ArrowUp':    e.preventDefault(); setVolume(audio.volume + 0.05); break;
                case 'ArrowDown':  e.preventDefault(); setVolume(audio.volume - 0.05); break;
                case 'm': case 'M': toggleMute(); break;
                case 'f': case 'F': if (currentStation) toggleFavorite(currentStation); break;
                case 'Escape':     if (floatWin) exitGadgetMode(); break;
            }
        }
        document.addEventListener('keydown', onKeyShortcut);

        // ============================================================
        // IDIOMA
        // ============================================================
        function changeLanguage(lang, defaultCountry = null) {
            currentLang = lang;
            localStorage.setItem('radioLang', lang);
            const x = i18n[lang];

            document.title = x.title;
            if (floatWin && !floatWin.closed && !currentStation) floatWin.document.title = x.title;
            byId('main-title-text').innerText = x.short;
            byId('search-input').placeholder = x.search;
            byId('favorites-empty').innerText = x.noFav;
            byId('lbl-detached-title').innerText = x.floatTitle;
            byId('lbl-detached-desc').innerHTML = x.floatDesc;
            byId('lbl-detached-btn').innerText = x.backBtn;
            byId('lbl-add-btn').innerText = x.addBtn;
            byId('add-name').placeholder = x.addName;
            byId('add-url').placeholder = x.addUrl;
            if (!currentStation) {
                byId('player-title').innerText = x.noStation;
                byId('player-subtitle').innerText = x.subStation;
            }
            renderFavorites();

            if (defaultCountry) {
                byId('country-select').value = defaultCountry;
                fetchStations(defaultCountry);
            }
        }

        // ============================================================
        // API Radio Browser
        // ============================================================
        async function fetchStations(countryOrRegion) {
            byId('loading-spinner').style.display = 'flex';
            byId('stations-list').classList.add('hidden');

            const url = countryOrRegion === 'Catalunya'
                ? 'https://de1.api.radio-browser.info/json/stations/search?language=catalan&limit=300&hidebroken=true'
                : `https://de1.api.radio-browser.info/json/stations/search?countrycode=${countryOrRegion}&limit=100&hidebroken=true`;

            try {
                const response = await fetch(url);
                let data = await response.json();
                data.sort((a, b) => a.name.trim().localeCompare(b.name.trim(), undefined, { sensitivity: 'base' }));
                allStations = withCustom(data.filter(s => s.url_resolved), { region: countryOrRegion });
                renderStations(allStations);
            } catch (error) {
                console.error("Error cargando emisoras:", error);
                byId('stations-list').innerHTML = `<div class="col-span-full text-center text-white/50 py-10">${t().connError}</div>`;
            }

            byId('loading-spinner').style.display = 'none';
            byId('stations-list').classList.remove('hidden');
        }

        let searchTimeout;
        document.getElementById('search-input').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim().toLowerCase();
            const countryVal = byId('country-select').value;

            searchTimeout = setTimeout(async () => {
                if (query.length < 2) { fetchStations(countryVal); return; }

                byId('loading-spinner').style.display = 'flex';
                byId('stations-list').classList.add('hidden');

                const url = `https://de1.api.radio-browser.info/json/stations/search?name=${encodeURIComponent(query)}&hidebroken=true&limit=100`;
                try {
                    const response = await fetch(url);
                    let data = await response.json();
                    data.sort((a, b) => a.name.trim().localeCompare(b.name.trim(), undefined, { sensitivity: 'base' }));
                    allStations = withCustom(data.filter(s => s.url_resolved), { query });
                    renderStations(allStations);
                } catch (e) {
                    console.error("Search error", e);
                }
                byId('loading-spinner').style.display = 'none';
                byId('stations-list').classList.remove('hidden');
            }, 500);
        });

        document.getElementById('country-select').addEventListener('change', (e) => {
            byId('search-input').value = '';
            fetchStations(e.target.value);
        });

        // ============================================================
        // RENDER
        // ============================================================
        function renderStations(stations) {
            const list = byId('stations-list');
            if (!list) return;
            list.innerHTML = '';

            if (stations.length === 0) {
                list.innerHTML = `<div class="col-span-full text-center text-white/50 py-10">${t().noStations}</div>`;
                return;
            }

            stations.forEach(station => {
                const isFav = favorites.some(f => f.stationuuid === station.stationuuid);
                const isActive = currentStation && currentStation.stationuuid === station.stationuuid;

                const borderStyle = isActive ? 'border-[#ffd600] shadow-[0_0_15px_rgba(255,214,0,0.2)]' : 'border-white/5 hover:border-white/20 hover:bg-white/5';
                const heartStyle = isFav ? 'text-[#ffd600] fill-current' : 'text-white/20 hover:text-white/60';

                const card = document.createElement('div');
                card.className = `station-card flex items-center p-3 rounded-xl border bg-black/40 cursor-pointer gap-3 ${borderStyle}`;

                const logoHtml = station.favicon
                    ? `<img src="${station.favicon}" class="w-full h-full object-cover ${isActive && isPlaying ? 'vinyl-spin' : 'rounded-lg'}" onerror="this.outerHTML='<span class=\\'text-white/40 font-bold\\'>${station.name.charAt(0)}</span>'">`
                    : `<span class="text-white/40 font-bold">${station.name.charAt(0)}</span>`;

                card.innerHTML = `
                    <div class="w-10 h-10 bg-white/5 rounded-lg flex items-center justify-center shrink-0 border border-white/5 overflow-hidden">
                        ${logoHtml}
                    </div>
                    <div class="flex-1 overflow-hidden pointer-events-none">
                        <div class="text-sm font-semibold text-white truncate">${station.name}</div>
                        <div class="text-xs text-white/40 truncate">${station.country || 'Radio'}</div>
                    </div>
                    <button class="fav-btn p-2 rounded-full hover:bg-white/10 transition-colors shrink-0 ${heartStyle}">
                        ${isFav ? ICON.heartOn('w-4 h-4 pointer-events-none') : ICON.heartOff('w-4 h-4 pointer-events-none')}
                    </button>
                    ${station.custom ? `<button class="del-btn p-1 rounded-full text-white/20 hover:text-red-400 hover:bg-white/10 transition-colors shrink-0" title="Treure">
                        <svg class="w-3.5 h-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>` : ''}
                `;

                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.fav-btn') && !e.target.closest('.del-btn')) playStation(station);
                });
                card.querySelector('.fav-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFavorite(station);
                });
                const del = card.querySelector('.del-btn');
                if (del) del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeCustomStation(station.stationuuid);
                });

                list.appendChild(card);
            });
        }

        function renderFavorites() {
            const list = byId('favorites-list');
            const emptyLabel = byId('favorites-empty');
            const lbl = byId('lbl-favorites');
            if (lbl) lbl.innerHTML = `${t().fav} (${favorites.length}/5) <svg class="w-3 h-3 text-[#ffd600]" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>`;

            renderGadgetFavs();
            // Al mòbil la barra de preferides és horitzontal: si és buida, fa nosa.
            const sidebar = byId('fav-sidebar');
            if (sidebar) sidebar.classList.toggle('is-empty', favorites.length === 0);
            if (!list || !emptyLabel) return;

            if (favorites.length === 0) {
                list.innerHTML = '';
                emptyLabel.style.display = 'block';
                return;
            }

            emptyLabel.style.display = 'none';
            list.innerHTML = '';

            favorites.forEach((station, index) => {
                const isActive = currentStation && currentStation.stationuuid === station.stationuuid;
                const activeStyle = isActive ? 'bg-white/10 border-[#ffd600]/50' : 'bg-black/20 border-white/5 hover:bg-white/5';

                const item = document.createElement('div');
                item.className = `flex items-center gap-3 p-2 rounded-lg border cursor-pointer group ${activeStyle}`;
                item.innerHTML = `
                    <span class="text-xs font-bold text-white/30 w-3">${index + 1}</span>
                    <div class="flex-1 overflow-hidden">
                        <div class="text-xs font-semibold text-white truncate group-hover:text-[#ffd600] transition-colors">${station.name}</div>
                    </div>
                    <button class="text-white/20 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all p-1" title="Eliminar">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                `;

                item.addEventListener('click', (e) => { if (!e.target.closest('button')) playStation(station); });
                item.querySelector('button').addEventListener('click', (e) => { e.stopPropagation(); toggleFavorite(station); });
                list.appendChild(item);
            });
        }

        /** Xips numerats 1-5 al gadget: accés directe a les preferides sense obrir la finestra gran. */
        function renderGadgetFavs() {
            const box = byId('gadget-favs');
            if (!box) return;
            box.innerHTML = '';

            if (favorites.length === 0) {
                box.innerHTML = `<span class="text-[10px] text-white/25 tracking-wide">${t().noFavsShort}</span>`;
                return;
            }

            favorites.forEach((station, i) => {
                const isActive = currentStation && currentStation.stationuuid === station.stationuuid;
                const chip = (box.ownerDocument || document).createElement('button');
                chip.className = `fav-chip ${isActive ? 'is-active' : ''}`;
                chip.textContent = i + 1;
                chip.title = station.name;
                chip.addEventListener('click', () => playStation(station));
                box.appendChild(chip);
            });
        }

        function toggleFavorite(station) {
            const index = favorites.findIndex(f => f.stationuuid === station.stationuuid);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                if (favorites.length >= 5) { toast(t().favLimit); return; }
                favorites.push(station);
            }
            localStorage.setItem('radioFavs', JSON.stringify(favorites));
            renderFavorites();
            if (allStations.length > 0) renderStations(allStations);
            updateFavIcons();
        }

        function updateFavIcons() {
            const isFav = currentStation && favorites.some(f => f.stationuuid === currentStation.stationuuid);
            const main = byId('btn-fav-main');
            const gadget = byId('btn-gadget-fav');
            if (main)   main.innerHTML   = isFav ? ICON.heartOn('w-5 h-5') : ICON.heartOff('w-5 h-5');
            if (gadget) {
                gadget.innerHTML = isFav ? ICON.heartOn('w-4 h-4') : ICON.heartOff('w-4 h-4');
                gadget.classList.toggle('text-white/25', !isFav);
            }
        }

        // ============================================================
        // VOLUM
        // ============================================================
        function setVolume(v) {
            v = Math.min(1, Math.max(0, Math.round(v * 100) / 100));
            audio.volume = v;
            if (v > 0) audio.muted = false;
            localStorage.setItem('radioVol', v);
            localStorage.setItem('radioMuted', audio.muted ? '1' : '');
            syncVolumeUI();
        }

        function toggleMute() {
            audio.muted = !audio.muted;
            localStorage.setItem('radioMuted', audio.muted ? '1' : '');
            syncVolumeUI();
        }

        function syncVolumeUI() {
            ['vol-slider', 'gadget-vol'].forEach(id => {
                const el = byId(id);
                if (el) el.value = audio.muted ? 0 : audio.volume;
            });
            const off = audio.muted || audio.volume === 0;
            const m1 = byId('btn-mute-main'), m2 = byId('btn-gadget-mute');
            if (m1) m1.innerHTML = off ? ICON.volOff('w-5 h-5') : ICON.volOn('w-5 h-5');
            if (m2) m2.innerHTML = off ? ICON.volOff('w-4 h-4') : ICON.volOn('w-4 h-4');
        }

        function onVolInput(e) {
            const v = parseFloat(e.target.value);
            audio.muted = false;
            setVolume(v);
        }
        document.getElementById('vol-slider').addEventListener('input', onVolInput);
        document.getElementById('gadget-vol').addEventListener('input', onVolInput);
        document.getElementById('btn-mute-main').addEventListener('click', toggleMute);
        document.getElementById('btn-gadget-mute').addEventListener('click', toggleMute);

        // ============================================================
        // AMBIENT: el color de l'emissora darrere de la interfície
        // ============================================================
        let ambientSlot = 0;

        /** Encreua les dues capes de cada contenidor cap a la imatge nova. */
        function setAmbient(url) {
            const next = ambientSlot, prev = 1 - ambientSlot;
            const containers = [document.getElementById('ambient'),
                                document.getElementById('view-ambient'),
                                byId('gadget-ambient')];

            containers.forEach(box => {
                if (!box) return;
                const layers = box.querySelectorAll('.ambient-layer');
                if (layers.length < 2) return;
                if (!url) { layers.forEach(l => l.classList.remove('on')); return; }
                layers[next].style.backgroundImage = 'url("' + url + '")';
                layers[next].classList.add('on');
                layers[prev].classList.remove('on');
            });

            if (url) ambientSlot = prev;
        }

        /** Només pintem el fons si el logotip carrega de debò i encara toca. */
        function updateAmbient(station) {
            if (!station || !station.favicon) { setAmbient(null); return; }
            const img = new Image();
            img.onload = () => {
                if (currentStation && currentStation.stationuuid === station.stationuuid) setAmbient(station.favicon);
            };
            img.onerror = () => setAmbient(null);
            img.src = station.favicon;
        }

        // ============================================================
        // VISUALITZADOR
        // Dibuixa l'espectre real del so. Si l'emissora no permet CORS no hi ha
        // dades i el canvas es queda amagat: preferim no ensenyar res abans que
        // una animació falsa que fingeixi seguir la música.
        // ============================================================
        let vizRAF = null;
        const vizPeaks = {};

        // Referències i contextos en memòria: buscar-los i demanar el context
        // a cada fotograma costa car quan es fa 60 vegades per segon.
        const vizCache = {};
        let vizRefreshIn = 0;

        function vizTargets() {
            if (vizRefreshIn-- <= 0) {
                vizRefreshIn = 30;
                [['viz-main', 72], ['viz-gadget', 28]].forEach(([id, maxH]) => {
                    const cv = byId(id);
                    if (!cv) { delete vizCache[id]; return; }
                    if (!vizCache[id] || vizCache[id].cv !== cv) {
                        vizCache[id] = { cv, ctx: cv.getContext('2d'), maxH, id };
                    }
                });
            }
            return Object.values(vizCache);
        }

        let lastFrame = 0, lastBass = -1;

        function drawViz(now) {
            vizRAF = requestAnimationFrame(drawViz);

            // 33 ms: per a un equalitzador de blocs, 30 imatges per segon es
            // veuen igual de fluides i estalvien la meitat de la feina.
            if (now - lastFrame < 33) return;
            lastFrame = now || 0;

            const live = vizLive();
            const targets = vizTargets();

            targets.forEach(({ cv, ctx }) => {
                if (cv.classList.contains('on') !== live) cv.classList.toggle('on', live);
                if (!live && cv.width) ctx.clearRect(0, 0, cv.width, cv.height);
            });
            if (!live) {
                if (lastBass !== 0) { lastBass = 0; document.documentElement.style.setProperty('--bass', 0); }
                return;
            }

            analyser.getByteFrequencyData(freqData);

            // Els greus mouen l'ambient de tota l'app. Ho actualitzem només quan
            // canvia de debò: cada canvi repinta una capa enorme i desenfocada.
            let bass = 0;
            for (let i = 0; i < 8; i++) bass += freqData[i];
            bass = Math.max(0, Math.min(1, ((bass / 8) - 120) / 130));
            bass = Math.round(bass * 12) / 12;
            if (bass !== lastBass) {
                lastBass = bass;
                document.documentElement.style.setProperty('--bass', bass);
                if (floatWin && !floatWin.closed) {
                    floatWin.document.documentElement.style.setProperty('--bass', bass);
                }
            }

            targets.forEach(({ cv, ctx, maxH, id }) => {
                if (!cv.clientWidth) return;
                const dpr = Math.min(2, (cv.ownerDocument.defaultView || window).devicePixelRatio || 1);
                const w = cv.clientWidth, h = cv.clientHeight;
                if (cv.width !== w * dpr || cv.height !== h * dpr) {
                    cv.width = w * dpr; cv.height = h * dpr;
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }
                ctx.clearRect(0, 0, w, h);

                // Equalitzador de blocs: cada columna és una pila de segments
                // separats, i el color el marca la columna (no l'alçada), fent
                // un escombrat de to de violeta a cian al llarg de l'espectre.
                const bars = Math.max(32, Math.min(96, Math.floor(w / 8)));
                const gap = id === 'viz-gadget' ? 2 : 3;
                const bw = (w - gap * (bars - 1)) / bars;

                const segGap = 2;
                const segH = id === 'viz-gadget' ? 3 : 5;
                const segs = Math.max(3, Math.floor(maxH / (segH + segGap)));

                let peaks = vizPeaks[id];
                if (!peaks || peaks.length !== bars) peaks = vizPeaks[id] = new Float32Array(bars);

                // Els MP3 de ràdio tallen cap als 15 kHz: la part alta de
                // l'espectre és sempre buida i deixaria mudes les últimes
                // bandes (justament les blaves). Analitzem només el que sona.
                const usable = Math.floor(freqData.length * 0.62);

                ctx.shadowBlur = 0;
                for (let i = 0; i < bars; i++) {
                    // Repartiment logarítmic: sense això, gairebé tot el dibuix
                    // serien aguts inaudibles i amb prou feines es mouria res.
                    const from = Math.floor(Math.pow(i / bars, 1.7) * usable);
                    const to = Math.max(from + 1, Math.floor(Math.pow((i + 1) / bars, 1.7) * usable));
                    let v = 0;
                    for (let j = from; j < to; j++) v = Math.max(v, freqData[j]);

                    const level = v / 255;
                    peaks[i] = Math.max(level, peaks[i] - 0.010);

                    const hue = (270 + (i / Math.max(1, bars - 1)) * 280) % 360;
                    const x = i * (bw + gap);
                    const lit = Math.round(level * segs);

                    ctx.fillStyle = 'hsl(' + hue.toFixed(1) + ', 95%, 55%)';
                    for (let k = 0; k < lit; k++) {
                        ctx.fillRect(x, h - (k + 1) * (segH + segGap) + segGap, bw, segH);
                    }

                    // El bloc del pic queda enlaire i va baixant a poc a poc
                    const pk = Math.round(peaks[i] * segs);
                    if (pk > lit) {
                        ctx.fillStyle = 'hsl(' + hue.toFixed(1) + ', 100%, 78%)';
                        ctx.fillRect(x, h - (pk + 1) * (segH + segGap) + segGap, bw, segH);
                    }
                }
            });
        }

        function startViz() { if (!vizRAF) vizRAF = requestAnimationFrame(drawViz); }

        // ============================================================
        // ESTAT DEL STREAM (connectant / en directe / caigut)
        // ============================================================
        function setStatus(kind) {
            const sub = byId('player-subtitle');
            const gsub = byId('gadget-subtitle');
            const country = currentStation ? (currentStation.country || t().live) : t().subStation;

            let text = country, color = '#ffd600';
            if (kind === 'loading') { text = t().connecting; color = 'rgba(255,255,255,.5)'; }
            if (kind === 'error')   { text = t().offline;    color = '#f87171'; }
            if (kind === 'blocked') { text = t().insecure;   color = '#f87171'; }

            if (sub)  { sub.textContent = text;  sub.style.color = color; }
            if (gsub) { gsub.textContent = text; gsub.style.color = color; }

            // El botó de "pestanya nova" només té sentit quan res més ha funcionat.
            [byId('btn-open-tab'), byId('btn-open-tab-gadget')].forEach(b => {
                if (!b) return;
                b.classList.toggle('hidden', kind !== 'blocked');
                b.textContent = '▶ ' + t().openTab;
            });
        }

        // ============================================================
        // REPRODUCTOR
        // ============================================================

        // Cadena d'URLs a provar per a l'emissora actual.
        let candidates = [];
        let candIdx = 0;
        let candAutoplay = true;
        let chainFailed = false;
        let triedAlternatives = false;
        let candTimer = null;
        let candMode = 0;      // 0 = amb CORS (visualitzador), 1 = sense

        /**
         * Moltes emissores surten repetides a la base de dades amb URLs diferents,
         * i sovint la còpia bona és https mentre la primera és http o està morta.
         * Busquem les germanes per nom abans de donar-nos per vençuts.
         */
        async function findAlternatives(station) {
            try {
                const url = 'https://de1.api.radio-browser.info/json/stations/search?limit=20&hidebroken=true&name='
                          + encodeURIComponent(station.name.trim());
                const data = await (await fetch(url)).json();

                // Les que es diuen exactament igual van primer: són la mateixa
                // emissora, no una germana local amb un nom que s'hi assembla.
                const mine = station.name.trim().toLowerCase();
                data.sort((a, b) => (b.name.trim().toLowerCase() === mine) - (a.name.trim().toLowerCase() === mine));

                const out = [];
                data.forEach(s => {
                    const u = s.url_resolved;
                    if (!u) return;
                    if (/^https:/i.test(u)) out.push(u);
                    else if (/^http:/i.test(u)) out.push('https:' + u.slice(5));
                });
                return out.filter((u, i) => out.indexOf(u) === i && !candidates.includes(u));
            } catch (e) {
                return [];
            }
        }

        function clearCandTimer() { if (candTimer) { clearTimeout(candTimer); candTimer = null; } }

        // ============================================================
        // MOTOR D'ÀUDIO
        //
        // Per analitzar el so cal que l'element tingui crossOrigin i que el
        // servidor enviï capçaleres CORS. Un cop connectes un element a la Web
        // Audio API, si després hi poses un stream sense CORS emmudeix per
        // sempre. Per això no en reaprofitem cap: en creem un de nou cada
        // vegada que canvia el mode, i el vell es llença.
        // ============================================================
        let audioCtx = null, analyser = null, freqData = null;

        function useAudioMode(wantCors) {
            if (audioCors === wantCors && audio.src !== '') return;
            const wasVol = audio.volume, wasMuted = audio.muted;
            try { audio.pause(); audio.removeAttribute('src'); audio.load(); } catch (e) {}

            audio = new Audio();
            if (wantCors) audio.crossOrigin = 'anonymous';
            audio.volume = wasVol;
            audio.muted = wasMuted;
            audioCors = wantCors;
            attachAudioListeners(audio);
            if (wantCors) connectAnalyser();
        }

        function connectAnalyser() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 1024;
                    analyser.smoothingTimeConstant = 0.75;
                    freqData = new Uint8Array(analyser.frequencyBinCount);
                    analyser.connect(audioCtx.destination);
                }
                audioCtx.createMediaElementSource(audio).connect(analyser);
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {
                console.warn('Analitzador no disponible:', e);
                analyser = null;
            }
        }

        /** Hi ha dades reals per dibuixar? */
        const vizLive = () => !!(analyser && audioCors && isPlaying);

        function loadCandidate() {
            if (hls) { hls.destroy(); hls = null; }
            clearCandTimer();
            const url = candidates[candIdx];
            if (!url) { failChain(); return; }

            // Provem primer amb CORS, que és el que permet el visualitzador.
            // Si l'emissora no l'accepta, la mateixa URL es reintenta sense.
            useAudioMode(candMode === 0);

            // Hi ha streams que no responen ni fallen: es queden penjats per
            // sempre (un port que no parla TLS, per exemple) i el navegador no
            // dispara cap error. Si no sona a temps, passem a la següent.
            if (candAutoplay) candTimer = setTimeout(() => {
                console.warn('Sense resposta a temps:', url, '(mode CORS:', candMode === 0, ')');
                nextCandidate();
            // Un rebuig de CORS arriba de seguida, així que aquesta espera només
            // ha de cobrir els streams que es pengen sense dir res.
            }, 9000);

            if (/\.m3u8/i.test(url) && window.Hls && Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { if (candAutoplay) audio.play().catch(() => {}); });
                hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) nextCandidate(); });
            } else {
                audio.src = url;
                if (candAutoplay) audio.play().catch(() => {});
            }
        }

        function nextCandidate() {
            clearCandTimer();
            if (candMode === 0) {
                // Potser només ha fallat per CORS: mateixa URL, sense analitzador.
                candMode = 1;
                loadCandidate();
            } else if (candIdx < candidates.length - 1) {
                candIdx++;
                candMode = 0;
                setStatus('loading');
                loadCandidate();
            } else {
                failChain();
            }
        }

        async function failChain() {
            clearCandTimer();
            // Abans de rendir-nos, mirem si la mateixa emissora té una altra
            // entrada a la base de dades amb una URL que sí que funcioni.
            if (!triedAlternatives && currentStation) {
                triedAlternatives = true;
                const asked = currentStation;
                setStatus('loading');
                const alts = await findAlternatives(asked);
                if (currentStation && currentStation.stationuuid === asked.stationuuid && alts.length) {
                    candidates.push(...alts);
                    nextCandidate();
                    return;
                }
            }

            chainFailed = true;
            isPlaying = false;
            setPlayIcons(false);
            setLiveIndicators(false);
            // Si emet només per http, encara queda la sortida de la pestanya nova.
            const mixedContent = currentStation && needsWorkaround(currentStation);
            setStatus(mixedContent ? 'blocked' : 'error');
            if (mixedContent && candAutoplay) toast(t().openTip);
        }

        function playStation(station, autoplay = true) {
            currentStation = station;
            localStorage.setItem('radioLast', JSON.stringify(station));

            byId('player-title').innerText = station.name;
            byId('gadget-title').innerText = station.name;
            byId('placeholder-station').textContent = station.name;
            if (floatWin && !floatWin.closed) floatWin.document.title = station.name;
            setStatus(autoplay ? 'loading' : 'idle');

            const setupArtwork = (initialId, imgId) => {
                const initial = byId(initialId), img = byId(imgId);
                if (!initial || !img) return;
                img.className = 'w-full h-full object-cover hidden';
                if (station.favicon) {
                    initial.classList.add('hidden');
                    img.src = station.favicon;
                    img.classList.remove('hidden');
                    if (isPlaying) img.classList.add('vinyl-spin');
                } else {
                    initial.innerText = station.name.charAt(0);
                    initial.classList.remove('hidden');
                    img.classList.add('hidden');
                }
            };
            setupArtwork('player-initial', 'player-img');
            setupArtwork('gadget-initial', 'gadget-img');

            updateAmbient(station);
            updateFavIcons();

            candidates = streamCandidates(station);
            candIdx = 0;
            candAutoplay = autoplay;
            chainFailed = false;
            triedAlternatives = false;
            candMode = 0;
            loadCandidate();

            if (allStations.length > 0) renderStations(allStations);
            renderFavorites();

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: station.name,
                    artist: station.country || t().live,
                    album: t().title,
                    artwork: [{ src: station.favicon || 'https://placehold.co/512x512/2c1a4d/ffd600?text=Radio', sizes: '512x512', type: 'image/png' }]
                });
            }
        }

        function togglePlay() {
            if (!currentStation) return;
            // Si tota la cadena va fallar, val la pena tornar-la a provar sencera.
            if (chainFailed) { playStation(currentStation, true); return; }
            if (audio.paused) { setStatus('loading'); audio.play().catch(() => setStatus('error')); }
            else audio.pause();
        }

        /** Llista de navegació: les preferides si n'hi ha; si no, el que hi ha a la graella. */
        function playlist() { return favorites.length ? favorites : allStations; }

        function step(delta) {
            const list = playlist();
            if (!list.length) return;
            let i = 0;
            if (currentStation) {
                const cur = list.findIndex(s => s.stationuuid === currentStation.stationuuid);
                if (cur > -1) i = (cur + delta + list.length) % list.length;
                else i = delta > 0 ? 0 : list.length - 1;
            } else {
                i = delta > 0 ? 0 : list.length - 1;
            }
            playStation(list[i]);
        }
        const playNext = () => step(1);
        const playPrev = () => step(-1);

        // Indicadors "en directe"
        function setLiveIndicators(on) {
            const badge = byId('gadget-live-badge'), geq = byId('gadget-eq'), peq = byId('player-eq');
            if (badge) badge.classList.toggle('hidden', !on);
            if (geq)   geq.classList.toggle('hidden', !on);
            if (peq)   peq.classList.toggle('hidden', !on);

            ['player-img', 'gadget-img'].forEach(id => {
                const img = byId(id);
                if (!img) return;
                if (on && !img.classList.contains('hidden')) img.classList.add('vinyl-spin');
                else img.classList.remove('vinyl-spin');
            });
        }

        function setPlayIcons(playing) {
            const b1 = byId('btn-play'), b2 = byId('btn-gadget-play');
            if (b1) b1.innerHTML = playing ? ICON.pause('w-5 h-5') : ICON.play('w-5 h-5');
            if (b2) b2.innerHTML = playing ? ICON.pause('w-6 h-6') : ICON.play('w-6 h-6');
        }

        function attachAudioListeners(el) {
        el.addEventListener('play', () => { isPlaying = true; setPlayIcons(true); });
        el.addEventListener('waiting', () => setStatus('loading'));
        el.addEventListener('playing', () => {
            clearCandTimer();
            isPlaying = true;
            setPlayIcons(true);
            setStatus('live');
            setLiveIndicators(true);
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            if (allStations.length > 0) renderStations(allStations);
        });
        el.addEventListener('pause', () => {
            clearCandTimer();
            isPlaying = false;
            setPlayIcons(false);
            setLiveIndicators(false);
            setStatus('idle');
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
            if (allStations.length > 0) renderStations(allStations);
        });
        el.addEventListener('error', () => {
            isPlaying = false;
            // Abans de rendir-nos, que nextCandidate decideixi què queda per
            // provar: el mateix stream sense CORS, o la següent URL.
            if (!chainFailed) { nextCandidate(); return; }
            failChain();
        });
        }
        attachAudioListeners(audio);

        document.getElementById('btn-play').addEventListener('click', togglePlay);
        document.getElementById('btn-gadget-play').addEventListener('click', togglePlay);
        document.getElementById('btn-gadget-next').addEventListener('click', playNext);
        document.getElementById('btn-gadget-prev').addEventListener('click', playPrev);
        document.getElementById('btn-fav-main').addEventListener('click', () => { if (currentStation) toggleFavorite(currentStation); });
        document.getElementById('btn-gadget-fav').addEventListener('click', () => { if (currentStation) toggleFavorite(currentStation); });
        // Doble clic a la caràtula del gadget = tornar a la finestra gran
        document.getElementById('gadget-artwork-container').addEventListener('dblclick', exitGadgetMode);

        document.getElementById('btn-copy-link').addEventListener('click', () => {
            if (!currentStation) return;
            navigator.clipboard.writeText(currentStation.url_resolved).then(() => toast(t().copied));
        });

        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => togglePlay());
            navigator.mediaSession.setActionHandler('pause', () => togglePlay());
            navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
            navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
        }

        // Si es tanca la pestanya, tanquem la finestreta (l'àudio hi viu, a la pestanya).
        window.addEventListener('pagehide', () => { if (floatWin && !floatWin.closed) floatWin.close(); });

        // ============================================================
        // INICI
        // ============================================================
        (function init() {
            const savedLang = localStorage.getItem('radioLang');
            if (savedLang && i18n[savedLang]) currentLang = savedLang;

            loadCustomStations();

            audio.volume = parseFloat(localStorage.getItem('radioVol') ?? '0.8');
            audio.muted = localStorage.getItem('radioMuted') === '1';

            // iOS ignora audio.volume (el volum és de maquinari): amaguem els sliders.
            audio.volume = 0.42;
            if (Math.abs(audio.volume - 0.42) > 0.001) {
                document.getElementById('player-volume').style.display = 'none';
                document.getElementById('gadget-volume').style.display = 'none';
            }
            audio.volume = parseFloat(localStorage.getItem('radioVol') ?? '0.8');
            syncVolumeUI();
            setPlayIcons(false);
            updateFavIcons();

            changeLanguage(currentLang);

            // Recupera l'última emissora (sense reproduir: cal un gest de l'usuari)
            try {
                const last = JSON.parse(localStorage.getItem('radioLast') || 'null');
                if (last && last.url_resolved) playStation(last, false);
            } catch (e) {}

            renderFavorites();
            startViz();
            fetchStations(currentLang === 'ca' ? 'Catalunya' : byId('country-select').value);
        })();
    </script>
</body>
</html>
